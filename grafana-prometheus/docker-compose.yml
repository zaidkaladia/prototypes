version: "3" 

services:  
    prometheus:
        container_name: prometheus
        image: prom/prometheus:latest
        ports:
            - 9090:9090
        volumes:
            - "./prometheus.yml:/etc/prometheus/prometheus.yml"
        networks:
            - backend

    api_1:
        container_name: api1
        build:
            context: ./api
            dockerfile: Dockerfile
        depends_on:
            - prometheus
        ports:
            - "4000:4000"
        command: python app.py runserver 0.0.0.0:4000
        networks:
            - backend
        # volumes:
        #     - "./api/app.py:/app.py"

    grafana:
        container_name: grafana
        image: grafana/grafana:latest
        ports:
            - "3000:3000"
        volumes:
            - grafana-storage:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
        depends_on:
            - api_1
        environment:
            - GF_AUTH_BASIC_ENABLED=false
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        networks:
            - backend

networks:
    backend:
        driver: bridge

volumes:
  grafana-storage: